{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}

<h1 class="mb-4">🎮 ゲーム一覧</h1>

{% for game in games %}

<div class="card mb-3">
    <div class="card-body d-flex justify-content-between align-items-center">

        <h3 class="mb-0">{{ game.gamename }}</h3>

        <a href="{% url 'players:game_detail' game.pk %}"
           class="btn btn-primary">
            詳細を見る
        </a>

    </div>
</div>

{% endfor %}

{% endblock content %}
